<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ขอรับสวัสดิการ | CWF</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body style="background:#F8FAFC; font-family:'Prompt', sans-serif;">

<div id="loader" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:99;display:flex;justify-content:center;align-items:center;"><h4>กำลังตรวจสอบสิทธิ์...</h4></div>

<div class="container p-4" style="max-width:500px;">
  <div id="welfareListSection">
    <h5 class="fw-bold mb-3 text-primary">เลือกสวัสดิการที่ต้องการเบิก</h5>
    <div id="welfareList"></div>
  </div>

  <div id="claimFormSection" style="display:none;">
    <button class="btn btn-sm btn-light mb-3" onclick="goBack()">กลับ</button>
    <h5 class="fw-bold text-center text-primary" id="titleWelfare"></h5>
    <div class="alert alert-warning py-2 small" id="docRequirement"></div>
    <form onsubmit="submitClaim(event)">
      <input type="hidden" name="action" value="submitClaim">
      <input type="hidden" id="uid" name="uid"> <input type="hidden" id="fullName" name="fullName"> <input type="hidden" id="center" name="center">
      <input type="hidden" id="welfareName" name="welfareName">
      
      <label class="small fw-bold">จำนวนเงินที่ขอเบิก</label>
      <input type="number" id="claimAmount" name="claimAmount" class="form-control mb-3" required>
      
      <label class="small fw-bold">แนบใบเสร็จ/ใบรับรองแพทย์</label>
      <input type="file" class="form-control mb-3" accept="image/*" required onchange="convertImg(this)">
      <input type="hidden" id="docBase64" name="docBase64"><input type="hidden" id="docFileName" name="docFileName">
      
      <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold">ส่งคำขอเบิกสวัสดิการ</button>
    </form>
  </div>
</div>

<script>
  const LIFF_ID = "2010764982-opxguAid"; 
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbw8ohbEXMSqCKzwTHeCem8pxpM_NcSA_twE3r4QU1HvsNZjtlEydGMoV6ffP1yBUOk/exec";
  let maxAmt = 0;

  document.addEventListener("DOMContentLoaded", async () => {
    await liff.init({ liffId: LIFF_ID });
    if(liff.isLoggedIn()) {
      const profile = await liff.getProfile(); document.getElementById('uid').value = profile.userId;
      const res = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify({ action: "getWelfareDashboard", uid: profile.userId }) }).then(r=>r.json());
      document.getElementById('loader').style.display = 'none';
      if(res.status === 'success') {
        document.getElementById('fullName').value = res.memberInfo.fullName; document.getElementById('center').value = res.memberInfo.center;
        res.welfareRules.forEach(r => {
          const isOk = r.eligibility === 'eligible';
          document.getElementById('welfareList').innerHTML += `
            <div class="card mb-2" style="cursor:${isOk?'pointer':'not-allowed'}; opacity:${isOk?1:0.6}" onclick="${isOk?`openForm('${r.welfareName}',${r.maxPerClaim},'${r.requiredDocs}')`:''}">
              <div class="card-body py-2 d-flex justify-content-between align-items-center">
                <div><strong class="d-block text-dark">${r.welfareName}</strong><small class="text-danger">${isOk ? `เบิกได้สูงสุด ${r.maxPerClaim} ฿` : r.reason}</small></div>
              </div>
            </div>`;
        });
      }
    } else liff.login();
  });

  function openForm(name, max, docs) {
    document.getElementById('welfareListSection').style.display='none'; document.getElementById('claimFormSection').style.display='block';
    document.getElementById('titleWelfare').innerText = name; document.getElementById('welfareName').value = name;
    document.getElementById('docRequirement').innerText = "ต้องแนบ: " + docs; maxAmt = max; document.getElementById('claimAmount').max = max;
  }
  function goBack() { document.getElementById('welfareListSection').style.display='block'; document.getElementById('claimFormSection').style.display='none'; }
  function convertImg(input) { const f = input.files[0]; if(f){ document.getElementById('docFileName').value = f.name; const r = new FileReader(); r.onload=e=>document.getElementById('docBase64').value=e.target.result; r.readAsDataURL(f); } }
  
  async function submitClaim(e) {
    e.preventDefault(); const btn = e.target.querySelector('button'); btn.disabled = true; btn.innerText = 'กำลังอัปโหลดเอกสาร...';
    const res = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify(Object.fromEntries(new FormData(e.target))) }).then(r=>r.json());
    if(res.status==='success') Swal.fire('สำเร็จ', 'ส่งเรื่องเรียบร้อย', 'success').then(()=>liff.closeWindow());
    else { Swal.fire('Error', res.message, 'error'); btn.disabled = false; btn.innerText = 'ส่งคำขอ'; }
  }
</script>
</body>
</html>
